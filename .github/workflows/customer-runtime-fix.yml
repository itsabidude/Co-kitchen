name: Customer Runtime Fix

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Apply customer runtime hardening'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fix
        run: node scripts/fix-customer-runtime.mjs
      - name: Verify build
        run: |
          npm install
          npm run build
      - name: Commit fix and remove temporary workflow
        run: |
          rm scripts/fix-customer-runtime.mjs
          rm .github/workflows/customer-runtime-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx scripts/fix-customer-runtime.mjs .github/workflows/customer-runtime-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m "Apply customer runtime hardening"
          git push
